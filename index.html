<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QWEN · fullscreen presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --paper:#faf9f5; --ink:#12161b; --dim:#7b858c;
    --rule:#d9d3c8; --accent:#c65f28; --teal:#0f7a6f;
    --dsp:'Chakra Petch',sans-serif; --mono:'IBM Plex Mono',monospace;
    --kr:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg)}
  body{font-family:var(--dsp);color:var(--ink);overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}

  /* ── debug overlay ─────────────────── */
  #debug{
    position:fixed;left:16px;bottom:16px;z-index:8;pointer-events:none;
    background:rgba(255,255,255,.9);border:1px solid var(--rule);border-radius:10px;
    padding:.75rem .95rem;font:11px/1.55 var(--mono);letter-spacing:.04em;
    box-shadow:0 14px 34px rgba(18,22,27,.10);transition:.35s;
    display:grid;grid-template-columns:auto 1fr;gap:.16rem .9rem;max-width:300px;
  }
  #debug.off{opacity:0;transform:translateY(14px);pointer-events:none}
  #debug .k{color:var(--dim)}
  #debug .v{color:var(--ink);font-weight:500}
  #debug .v.hot{color:var(--accent)}
  #debug .v.ok{color:var(--teal)}
  #debug hr{border:0;border-top:1px solid var(--rule);margin:.5rem 0;grid-column:1/-1}
  #spark{grid-column:1/-1;display:block;border:1px solid var(--rule);border-radius:4px;margin:.3rem 0}
  #log{grid-column:1/-1;font-size:10px;color:var(--dim);line-height:1.5;margin-top:.25rem}
  #log b{color:var(--ink);font-weight:500}

  /* ── control chips ─────────────────── */
  #ui{position:fixed;right:16px;bottom:16px;z-index:9;display:flex;gap:.4rem;
    transition:.4s;opacity:1}
  #ui.hide{opacity:0;pointer-events:none;transform:translateY(10px)}
  .chip{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;
    padding:.5rem .78rem;border:1px solid var(--rule);background:rgba(255,255,255,.9);
    color:var(--ink);border-radius:7px;cursor:pointer;transition:.22s;display:flex;gap:.45rem;align-items:center}
  .chip:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .led{width:7px;height:7px;border-radius:50%;background:#c9c2b8;transition:.22s}
  .chip:hover .led{background:#fff}
  .chip.on .led{background:var(--teal)}
  .chip.rec .led{background:var(--accent);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}

  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:7;
    font:10px var(--mono);letter-spacing:.22em;color:var(--dim);transition:.4s;text-transform:uppercase}
  #hint.hide{opacity:0}

  .badge{position:fixed;right:16px;top:16px;z-index:8;font:11px var(--mono);
    letter-spacing:.2em;color:var(--accent);display:none;align-items:center;gap:.5rem}
  .badge.show{display:flex}
  .badge .led{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="debug">
  <span class="k">fps</span><span class="v ok" id="d-fps">–</span>
  <span class="k">frames</span><span class="v" id="d-frames">0</span>
  <span class="k">render</span><span class="v" id="d-render">–</span>
  <span class="k">viewport</span><span class="v" id="d-vp">–</span>
  <span class="k">canvas</span><span class="v" id="d-cv">–</span>
  <span class="k">dpr</span><span class="v" id="d-dpr">–</span>
  <hr>
  <span class="k">scene</span><span class="v hot" id="d-scene">–</span>
  <span class="k">local</span><span class="v" id="d-local">–</span>
  <span class="k">time</span><span class="v" id="d-time">–</span>
  <span class="k">progress</span><span class="v" id="d-prog">–</span>
  <span class="k">state</span><span class="v" id="d-state">–</span>
  <span class="k">loops</span><span class="v" id="d-loops">0</span>
  <span class="k">guides</span><span class="v" id="d-guides">off</span>
  <canvas id="spark" width="264" height="34"></canvas>
  <div id="log">boot</div>
</div>

<div class="badge" id="badge"><span class="led"></span>RECORDING</div>

<div id="ui">
  <button class="chip on" id="btnPlay"><span class="led"></span><span id="playLabel">PAUSE</span></button>
  <button class="chip on" id="btnLoop"><span class="led"></span>LOOP</button>
  <button class="chip on" id="btnDebug"><span class="led"></span>DEBUG</button>
  <button class="chip" id="btnFull"><span class="led"></span>FULL</button>
  <button class="chip" id="btnRec"><span class="led"></span>EXPORT</button>
</div>
<div id="hint">F FULLSCREEN · SPACE PAUSE · ←→ SEEK · R RESTART · D DEBUG · G GUIDES</div>

<script>
/* ─────────────────────────────────────── */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const KR='"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const D='Chakra Petch', M='IBM Plex Mono';
const INK='#12161b', DIM='#7b858c', RULE='#d9d3c8', ACC='#c65f28', TEAL='#0f7a6f';
const BW=1280, BH=720, PAD=72;
const SCENES=[['OPENING',4.2],['FAMILY',6.2],['PROCESS',7.2],['SPECS',6.2],['TIMELINE',5.6],['CLOSING',5.2]];
const DUR=SCENES.reduce((a,s)=>a+s[1],0);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eOut=t=>1-Math.pow(1-clamp(t),3);
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

let W,H,dpr,s,ox,oy;
function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  s=Math.min(W/BW,H/BH); ox=(W-BW*s)/2; oy=(H-BH*s)/2;
}
addEventListener('resize',resize); resize();

let t=0,playing=true,loop=true,loops=0,debugOn=true,guides=false,frames=0,fps=60,renderMs=0;
const fpsHist=[]; let last=performance.now(), fpsAcc=0, fpsN=0;

/* ── helpers ─────────────────────────── */
let SA=1;
function text(str,x,y,{font=D,size,weight=400,color=INK,tracking=0,alpha=1,align='left'}){
  ctx.font=`${weight} ${size}px ${font},${KR}`;
  ctx.textBaseline='alphabetic';
  const ch=[...str]; let w=0; for(const c of ch) w+=ctx.measureText(c).width;
  w+=tracking*(ch.length-1);
  let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.fillStyle=color; ctx.globalAlpha=SA*alpha;
  for(const c of ch){ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+tracking;}
  ctx.globalAlpha=1;
}
function lines(str,x,y,o,ls){str.split('\n').forEach((l,i)=>text(l,x,y+i*ls,o));}
function rule(x,y,w,c=RULE,th=1,a=1){ctx.strokeStyle=c;ctx.lineWidth=th;ctx.globalAlpha=SA*a;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();ctx.globalAlpha=1;}
function card(x,y,w,h,a){ctx.globalAlpha=SA*a;ctx.fillStyle='#fff';ctx.strokeStyle=RULE;ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(x,y,w,h,10);ctx.fill();ctx.stroke();ctx.globalAlpha=1;}
function node(x,y,w,h,label,a){ctx.globalAlpha=SA*a;ctx.fillStyle='#fff';ctx.strokeStyle=RULE;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();ctx.stroke();
  text(label,x+w/2,y+h/2+4,{size:12,weight:600,tracking:2,align:'center'});ctx.globalAlpha=1;}
function dot(x,y,r,c=ACC,tt=0){const p=reduce?0.5:(Math.sin(tt*2.2)+1)/2;
  ctx.globalAlpha=SA*(0.25+0.4*p);ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r*(0.8+0.4*p),0,7);ctx.fill();ctx.globalAlpha=1;}

/* ── background ─────────────────────── */
function bg(tt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#faf9f5';ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,255,255,.92)');g.addColorStop(1,'rgba(236,231,224,.5)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const step=36, drift=reduce?0:(tt*10)%step;
  ctx.fillStyle='rgba(18,22,27,.05)';
  for(let x=-step+drift;x<W+step;x+=step)for(let y=-step;y<H+step;y+=step){ctx.beginPath();ctx.arc(x,y,1.4,0,7);ctx.fill();}
  const bx=W*0.8+Math.sin(tt*0.3)*90, by=H*0.22+Math.cos(tt*0.25)*50;
  const rg=ctx.createRadialGradient(bx,by,0,bx,by,Math.max(W,H)*0.35);
  rg.addColorStop(0,'rgba(198,95,40,.10)');rg.addColorStop(1,'rgba(198,95,40,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  if(guides){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.strokeStyle='rgba(198,95,40,.45)';ctx.lineWidth=1;
    const m=64*s; ctx.strokeRect(ox+m,oy+m,BW*s-2*m,BH*s-2*m);
    ctx.strokeStyle='rgba(18,22,27,.2)';ctx.beginPath();
    ctx.moveTo(ox+m,BH*s/2+oy);ctx.lineTo(ox+BW*s-m,BH*s/2+oy);
    ctx.moveTo(BW*s/2+ox,oy+m);ctx.lineTo(BW*s/2+ox,BH*s-m);ctx.stroke();}
}
function wipe(l){
  if(l>0.42||reduce)return;
  const x=PAD+(BW-PAD*2)*(l/0.42);
  ctx.strokeStyle=ACC;ctx.lineWidth=2;ctx.globalAlpha=SA*(1-l/0.42)*0.8;
  ctx.beginPath();ctx.moveTo(x,PAD-14);ctx.lineTo(x,BH-PAD+14);ctx.stroke();ctx.globalAlpha=1;
}

/* ── scenes ─────────────────────────── */
function scene1(l){
  SA=Math.min(clamp(l/0.5),clamp((4.2-l)/0.5));
  text('ALIBABA · OPEN WEIGHT LLM',PAD,232,{font:M,size:12,tracking:4,alpha:clamp(l/0.8)});
  const letters=['Q','W','E','N'];let x=PAD;ctx.font=`700 128px ${D},${KR}`;ctx.textBaseline='alphabetic';
  letters.forEach((c,i)=>{
    const w=ctx.measureText(c).width+8, p=eOut(clamp((l-0.5-i*0.18)/0.6));
    ctx.save();ctx.beginPath();ctx.rect(x,262,w,150*p);ctx.clip();
    ctx.globalAlpha=SA*p;ctx.fillStyle=INK;ctx.fillText(c,x,400);ctx.restore();ctx.globalAlpha=1;
    x+=w;
  });
  ctx.strokeStyle=ACC;ctx.lineWidth=2;ctx.globalAlpha=SA;
  ctx.beginPath();ctx.moveTo(PAD,432);ctx.lineTo(PAD+380*eOut(clamp((l-1.9)/0.8)),432);ctx.stroke();ctx.globalAlpha=1;
  lines('질문을 토큰으로 쪼개고, 문맥을 계산하고,\n다음 픰을 한 개씩 예측해 답을 이어 씁니다.',PAD,470,
    {size:15,color:DIM,alpha:eOut(clamp((l-2.5)/0.9))},24);
  dot(W-PAD-44,232,6,ACC,l+2);
}
const FAMILY=[['Qwen3','BASE · REASONING','사고 모드를 켜고 끌 수 있는\n하이브리드 · MoE 포함'],
  ['Qwen2.5','GENERAL','0.5B–72B 다양한 사이즈\n다국어 지원'],
  ['Qwen-VL','VISION','이미지·문서 해석\n표·수식·OCR'],
  ['Qwen-Coder','CODE','코드 생성·수정·리뷰\n에이전트 코딩'],
  ['Qwen-Audio','AUDIO','음성 입력과\n음성 대화 계열']];
function scene2(l){
  SA=Math.min(clamp(l/0.5),clamp((6.2-l)/0.5));
  text('01 — FAMILY',PAD,206,{font:M,size:12,tracking:4,alpha:clamp(l/0.5)});
  text('패밀리 라인업',PAD,238,{size:26,weight:700,alpha:eOut(clamp(l/0.7))});
  const offs=[0,26,12,40,20];
  FAMILY.forEach(([name,tag,desc],i)=>{
    const p=eOut(clamp((l-0.35-i*0.14)/0.55));
    const x=PAD+i*204-50*(1-p), y=290+offs[i];
    card(x,y,176,150,p);
    text(tag,x+16,y+32,{font:M,size:10,tracking:2.5,color:ACC,alpha:p});
    text(name,x+16,y+62,{size:22,weight:700,alpha:p});
    lines(desc,x+16,y+88,{size:12,color:DIM,alpha:p},16);
  });
}
function scene3(l){
  SA=Math.min(clamp(l/0.5),clamp((7.2-l)/0.5));
  text('02 — PROCESS',PAD,188,{font:M,size:12,tracking:4,alpha:clamp(l/0.5)});
  text('토큰이 레이어를 통과해 답이 된다',PAD,220,{size:24,weight:700,alpha:eOut(clamp(l/0.7))});
  const nodes=['INPUT','TOKENIZE','ATTENTION','FFN ×N','DECODE','ANSWER'];
  const nw=118,gap=34,y=328,h=52,totalW=nodes.length*nw+(nodes.length-1)*gap;
  const lineP=eOut(clamp(l/1.2));
  ctx.strokeStyle=TEAL;ctx.lineWidth=1.2;ctx.setLineDash([5,8]);ctx.lineDashOffset=-l*14;ctx.globalAlpha=SA*0.7;
  ctx.beginPath();ctx.moveTo(PAD,y+h/2);ctx.lineTo(PAD+totalW*lineP,y+h/2);ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=1;
  nodes.forEach((n,i)=>{const p=eOut(clamp((l-0.5-i*0.12)/0.5)),x=PAD+i*(nw+gap);
    ctx.save();ctx.translate(x+nw/2,y+h/2);ctx.scale(p,p);ctx.translate(-x-nw/2,-y-h/2);
    node(x,y,nw,h,n,p);ctx.restore();});
  const cols=[ACC,TEAL,'#b34b2f'];
  for(let k=0;k<3;k++){const d=(l*0.22+k/3)%1;
    if(d<=lineP){ctx.globalAlpha=SA;ctx.fillStyle=cols[k];ctx.beginPath();
      ctx.arc(PAD+totalW*d,y+h/2,4,0,7);ctx.fill();ctx.globalAlpha=1;}}
  lines('질문을 잘게 쪼개 토큰으로 만들고 → 어텐션이 앞 문맥을 계산하고 →\n레이어마다 표상을 깊게 갱신하고 → 다음 토큰을 예측해 한 글자씩 이어 씁니다.',PAD,468,
    {size:13,color:DIM,alpha:eOut(clamp((l-1.8)/1.2))},22);
  text('transformer blocks · next-token prediction',W-PAD,556,{font:M,size:11,tracking:2,color:DIM,align:'right',alpha:eOut(clamp((l-2.2)/1))});
}
function scene4(l){
  SA=Math.min(clamp(l/0.5),clamp((6.2-l)/0.5));
  text('03 — SPECS',PAD,188,{font:M,size:12,tracking:4,alpha:clamp(l/0.5)});
  rule(PAD,226,1136*eOut(clamp(l/1)),RULE,1,clamp(l/0.6));
  const specs=[['235','B','최대 변형 · MoE','파라미터 중 일부만 활성화'],
    ['119','+','언어','다국어 이해와 생성'],['128','K','컨텍스트','약 128K 토큰 창']];
  specs.forEach(([v,u,name,desc],i)=>{
    const p=eOut(clamp((l-0.3-i*0.25)/1.1));
    const num=Math.round(+v*p), x=PAD+i*380+10;
    text(String(num),x,326,{size:84,weight:700,alpha:p});
    ctx.font=`700 84px ${D},${KR}`; const wNum=ctx.measureText(String(num)).width;
    text(u,x+wNum+10,326,{size:26,weight:500,color:ACC,alpha:p});
    text(name,x,368,{size:14,weight:700,alpha:p});
    text(desc,x,392,{size:12,color:DIM,alpha:p});
  });
  text('대다수 모델은 오픈 웨이트 · Apache-2.0 계열 · 로컬 GPU / vLLM / llama.cpp 배포',PAD,556,
    {size:13,color:DIM,alpha:eOut(clamp((l-1.6)/1.2))});
}
const TL=[['2023','Qwen 첫 공개 · 이후 오픈 웨이트 확장'],['2024','Qwen1.5 → Qwen2 · 다국어·장문 강화'],
  ['2024.09','Qwen2.5 · 코딩·수리·다양한 사이즈'],['2025.04','Qwen3 · 사고 모드 전환 · MoE 포함'],
  ['2025+','비전·코딩 계열 확장 · Qwen3-VL / Coder']];
function scene5(l){
  SA=Math.min(clamp(l/0.5),clamp((5.6-l)/0.5));
  text('04 — TIMELINE',PAD,188,{font:M,size:12,tracking:4,alpha:clamp(l/0.5)});
  text('계열의 변화',PAD,220,{size:24,weight:700,alpha:eOut(clamp(l/0.7))});
  const railX=PAD+8,y0=266,railP=eOut(clamp((l-0.2)/1.2));
  ctx.strokeStyle=ACC;ctx.lineWidth=2;ctx.globalAlpha=SA*0.85;
  ctx.beginPath();ctx.moveTo(railX,y0);ctx.lineTo(railX,y0+300*railP);ctx.stroke();ctx.globalAlpha=1;
  TL.forEach(([yr,txt],i)=>{const p=eOut(clamp((l-0.5-i*0.45)/0.6)),y=y0+i*66;
    dot(railX,y,4,i%2?TEAL:ACC,l+i);
    text(yr,railX+26,y+4,{size:16,weight:700,color:ACC,alpha:p});
    text(txt,railX+124,y+4,{size:14,color:DIM,alpha:p});});
}
function scene6(l){
  SA=Math.min(clamp(l/0.6),clamp((5.2-l)/0.6));
  const p=eOut(clamp(l/0.9));
  ctx.save();ctx.translate(PAD+80,326);ctx.scale(p,p);ctx.translate(-PAD-80,-326);
  text('QWEN',PAD,326,{size:72,weight:700,tracking:6});ctx.restore();
  dot(PAD+40,302,6,ACC,l+1);
  ['ALIBABA GROUP','OPEN WEIGHTS','Apache-2.0 (대다수)','TEXT · IMAGE · AUDIO · VIDEO']
    .forEach((m,i)=>text(m,PAD+300,296+i*30,{font:i<2?M:D,size:13,tracking:2,color:i===0?INK:DIM,
      alpha:eOut(clamp((l-0.8-i*0.2)/0.7))}));
  text('model cards에서 버전·라이선스·성능 확인',PAD,466,{size:13,color:DIM,alpha:eOut(clamp((l-1.5)/1))});
  rule(PAD,496,300*eOut(clamp((l-1.8)/0.8)),ACC,2);
}
const RENDER=[scene1,scene2,scene3,scene4,scene5,scene6];

/* ── HUD inside content ─────────────── */
function hud(tt,idx){
  text('QWEN',PAD,34,{size:14,weight:700,tracking:5});
  text(`${String(idx+1).padStart(2,'0')} — ${SCENES[idx][0]}`,PAD+130,34,{font:M,size:11,color:DIM,tracking:2});
  text(`${fmt(tt)} / ${fmt(DUR)}`,BW-PAD,34,{font:M,size:11,color:DIM,tracking:2,align:'right'});
  ctx.strokeStyle=RULE;ctx.lineWidth=2;ctx.globalAlpha=SA*0.8;
  ctx.beginPath();ctx.moveTo(0,BH-12);ctx.lineTo(BW,BH-12);ctx.stroke();
  ctx.strokeStyle=ACC;ctx.globalAlpha=SA;
  ctx.beginPath();ctx.moveTo(0,BH-12);ctx.lineTo(BW*(tt/DUR),BH-12);ctx.stroke();ctx.globalAlpha=1;
}

/* ── debug ──────────────────────────── */
const $=id=>document.getElementById(id);
const spark=$('spark'), sctx=spark.getContext('2d');
function drawSpark(){
  sctx.clearRect(0,0,spark.width,spark.height);
  sctx.strokeStyle='rgba(198,95,40,.8)';sctx.lineWidth=1.5;
  const max=70; sctx.beginPath();
  fpsHist.forEach((f,i)=>{const x=i/(fpsHist.length-1)*spark.width, y=spark.height-(f/max)*spark.height;
    i?sctx.lineTo(x,y):sctx.moveTo(x,y);});sctx.stroke();
  sctx.strokeStyle='rgba(18,22,27,.2)';sctx.beginPath();sctx.moveTo(0,spark.height-1);sctx.lineTo(spark.width,spark.height-1);sctx.stroke();
}
function log(msg){
  const el=$('log'); const stamp=`${fmt(t)}`;
  el.innerHTML=`<b>${stamp}</b> ${msg}<br>`+el.innerHTML.split('<br>').slice(0,5).join('<br>');
}
function updateDebug(idx,local){
  $('d-fps').textContent=fps.toFixed(1);
  $('d-frames').textContent=frames.toLocaleString();
  $('d-render').textContent=renderMs.toFixed(2)+' ms';
  $('d-vp').textContent=`${W}×${H}`;
  $('d-cv').textContent=`${cv.width}×${cv.height}`;
  $('d-dpr').textContent=dpr.toFixed(2);
  $('d-scene').textContent=`${idx+1}/${SCENES.length} · ${SCENES[idx][0]}`;
  $('d-local').textContent=local.toFixed(2)+' s';
  $('d-time').textContent=fmt(t);
  $('d-prog').textContent=(t/DUR*100).toFixed(1)+' %';
  $('d-state').textContent=playing?'▶ PLAYING':'❚❚ HOLD';
  $('d-state').className='v '+(playing?'ok':'hot');
  $('d-loops').textContent=loops;
  $('d-guides').textContent=guides?'on':'off';
  drawSpark();
}

/* ── loop ───────────────────────────── */
let idx=0, local=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.25){fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;fpsHist.push(fps);if(fpsHist.length>60)fpsHist.shift();}
  if(playing){
    t+=dt;
    if(t>=DUR){
      if(loop){t=0;loops++;log(`loop ${loops} → restart`);}
      else{t=DUR;playing=false;syncUI();log('timeline end · hold');}
    }
  }
  idx=0; local=t; for(const sc of SCENES){ if(t<sc[1]){local=t;break;} t>=idx*0; idx+=sc[1]; }
  idx=0; let acc=0; local=t;
  for(const sc of SCENES){ if(t<acc+sc[1]){local=t-acc;break;} acc+=sc[1]; idx++; }

  const r0=performance.now();
  bg(now/1000);
  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);
  RENDER[idx](local);
  if(t>=DUR){RENDER[SCENES.length-1](SCENES[SCENES.length-1][1]);idx=SCENES.length-1;local=SCENES[idx][1];}
  wipe(local);
  hud(t,idx);
  renderMs=performance.now()-r0;
  frames++;
  if(debugOn)updateDebug(idx,local);
  requestAnimationFrame(frame);
}

/* ── UI ─────────────────────────────── */
function syncUI(){
  $('playLabel').textContent=playing?'PAUSE':'PLAY';
  $('btnPlay').classList.toggle('on',playing);
  $('btnLoop').classList.toggle('on',loop);
  $('btnDebug').classList.toggle('on',debugOn);
  $('debug').classList.toggle('off',!debugOn);
}
$('btnPlay').onclick=()=>{if(t>=DUR)t=0;playing=!playing;log(playing?'resume':'pause');syncUI();};
$('btnLoop').onclick=()=>{loop=!loop;log('loop '+(loop?'on':'off'));syncUI();};
$('btnDebug').onclick=()=>{debugOn=!debugOn;log('debug '+(debugOn?'on':'off'));syncUI();};
$('btnFull').onclick=toggleFull;
$('btnRec').onclick=exportWebM;

function toggleFull(){
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>log('fullscreen blocked'));
}
document.addEventListener('fullscreenchange',()=>{log(`fullscreen ${document.fullscreenElement?'on':'off'}`);resize();});

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' ')e.preventDefault(),$('btnPlay').click();
  else if(k==='f'){e.preventDefault();toggleFull();}
  else if(k==='r'){t=0;playing=true;log('restart');syncUI();}
  else if(k==='d')$('btnDebug').click();
  else if(k==='g'){guides=!guides;log('guides '+(guides?'on':'off'));}
  else if(k==='e')$('btnRec').click();
  else if(k==='l'){loop=!loop;log('loop '+(loop?'on':'off'));syncUI();}
  else if(k==='arrowleft'){e.preventDefault();t=Math.max(0,t-1);playing=false;log('seek −1s');syncUI();}
  else if(k==='arrowright'){e.preventDefault();t=Math.min(DUR,t+1);playing=false;log('seek +1s');syncUI();}
  else if(k>='1'&&k<='6'){let acc=0;for(let i=0<+k-1;i<+k-1;i++)acc+=SCENES[i][1];t=acc;playing=true;log(`jump scene ${k}`);syncUI();}
});

/* pointer: click=pause, drag bottom=seek */
let seeking=false;
cv.addEventListener('pointerdown',e=>{
  if(e.clientY>H-34){seeking=true;t=clamp(e.clientX/W*DUR,0,DUR);playing=false;syncUI();cv.setPointerCapture(e.pointerId);}
  else $('btnPlay').click();
});
cv.addEventListener('pointermove',e=>{if(seeking)t=clamp(e.clientX/W*DUR,0,DUR);});
cv.addEventListener('pointerup',()=>{if(seeking){seeking=false;log(`seek ${fmt(t)}`);}});

/* idle hide UI */
let uiTimer;
function bumpUI(){
  $('ui').classList.remove('hide');$('hint').classList.remove('hide');
  clearTimeout(uiTimer); uiTimer=setTimeout(()=>{$('ui').classList.add('hide');$('hint').classList.add('hide');},3800);
}
addEventListener('mousemove',bumpUI); bumpUI();

/* export */
let rec=null, chunks=[];
function exportWebM(){
  if(!('MediaRecorder' in window)){alert('이 브라우저는 녹화 미지원 (Chrome·Edge 사용)');return;}
  if(rec){rec.stop();return;}
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  rec=new MediaRecorder(cv.captureStream(24),{mimeType:mime,videoBitrate:9000000});
  chunks=[]; rec.ondataavailable=e=>e.data&&chunks.push(e.data);
  rec.onstop=()=>{rec=null;$('btnRec').classList.remove('rec');$('badge').classList.remove('show');
    const blob=new Blob(chunks,{type:'video/webm'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='qwen-fullscreen.webm';a.click();log('export saved');};
  $('btnRec').classList.add('rec');$('badge').classList.add('show');
  t=0;playing=true;loop=false;syncUI();log('recording start');rec.start();
}

document.fonts.ready.then(()=>{log('fonts ready');last=performance.now();requestAnimationFrame(frame);});
</script>
