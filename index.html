<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qwen 모션그래픽 · white minimal video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161b;
    --dim:#7b858c;
    --rule:#d9d3c8;
    --accent:#c65f28;
    --bg:#ffffff;
    --display:'Chakra Petch',sans-serif;
    --mono:'IBM Plex Mono',monospace;
    --korean:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--display);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(1.5rem,4vw,3rem) clamp(1rem,4vw,2rem);
  }

  .topbar{width:100%;max-width:1180px;display:flex;justify-content:space-between;
    align-items:flex-end;gap:1rem;padding-bottom:1.2rem;border-bottom:1px solid var(--rule)}
  .brand{display:flex;align-items:baseline;gap:.7rem}
  .brand b{font-weight:700;font-size:1.05rem;letter-spacing:.16em}
  .brand span{font-family:var(--mono);font-size:.7rem;color:var(--dim);letter-spacing:.2em}

  .controls{display:flex;gap:.6rem;align-items:center}
  .btn{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    padding:.55rem .9rem;border:1px solid var(--rule);background:#fff;color:var(--ink);
    border-radius:6px;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:.5rem;
  }
  .btn:hover{border-color:var(--ink);background:var(--ink);color:#fff}
  .btn.rec{border-color:var(--accent);color:var(--accent)}
  .btn.rec:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn .dot{width:8px;height:8px;border-radius:50%;background:#c9c2b8;transition:.25s}
  .btn:hover .dot{background:#fff}
  .btn.recording .dot{background:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}

  .player{width:100%;max-width:1180px;display:grid;
    grid-template-columns:1fr 240px;gap:clamp(1rem,3vw,2.4rem);
    padding-top:clamp(1.2rem,3vw,2rem)}
  .stage{border:1px solid var(--rule);border-radius:14px;overflow:hidden;
    background:#faf9f5;box-shadow:0 24px 60px rgba(20,22,27,.08)}
  canvas{display:block;width:100%;height:auto}
  canvas:hover{cursor:pointer}

  .scrub{width:100%;max-width:1180px;padding-top:1rem;display:flex;align-items:center;gap:1rem}
  .scrub input{flex:1;appearance:none;height:3px;background:var(--rule);border-radius:99px;outline:none;cursor:pointer}
  .scrub input::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--accent);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .scrub .tc{font-family:var(--mono);font-size:.72rem;color:var(--dim);letter-spacing:.14em}

  .scenes{display:flex;flex-direction:column;gap:.4rem}
  .scenes h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;color:var(--dim);
    text-transform:uppercase;margin-bottom:.6rem}
  .scenes button{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;color:var(--dim);
    background:none;border:none;border-left:2px solid var(--rule);padding:.5rem .7rem;
    text-align:left;cursor:pointer;transition:.3s}
  .scenes button:hover{color:var(--ink)}
  .scenes button.active{color:var(--accent);border-color:var(--accent);font-weight:500}

  .note{margin-top:1.6rem;font-family:var(--mono);font-size:.72rem;color:var(--dim);
    letter-spacing:.08em;max-width:1180px;width:100%;display:flex;justify-content:space-between;
    gap:1rem;flex-wrap:wrap}
  .note a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule)}
  .note a:hover{border-color:var(--accent)}

  @media(max-width:860px){
    .player{grid-template-columns:1fr}
    .scenes{flex-direction:row;flex-wrap:wrap}
    .scenes button{border-left:none;border-bottom:1px solid var(--rule)}
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><b>QWEN</b><span>MOTION GRAPHIC · 1280×720 · 29s</span></div>
    <div class="controls">
      <button class="btn" id="playBtn"><span class="dot"></span><span id="playLabel">PAUSE</span></button>
      <button class="btn" id="restartBtn">RESTART</button>
      <button class="btn rec" id="recBtn"><span class="dot"></span>EXPORT WEBM</button>
    </div>
  </div>

  <div class="player">
    <div class="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
    <div class="scenes">
      <h4>SCENE LIST</h4>
      <button data-s="0">01 · 오프닝</button>
      <button data-s="1">02 · 패밀리</button>
      <button data-s="2">03 · 작동 방식</button>
      <button data-s="3">04 · 스펙</button>
      <button data-s="4">05 · 타임라인</button>
      <button data-s="5">06 · 클로징</button>
    </div>
  </div>

  <div class="scrub">
    <input type="range" id="scrub" min="0" max="29" step="0.01" value="0">
    <span class="tc" id="tc">00:00 / 00:29</span>
  </div>

  <div class="note">
    <span>실제 API 시연이 아닌 설명용 모션그래픽입니다. 수치는 공개 정보 기반의 대략값.</span>
    <span>내보내기: Chrome·Edge에서 <a href="#" onclick="return false">.webm</a> 저장 지원</span>
  </div>

<script>
/* ── 기본 ─────────────────────────────── */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1280, H = 720, PAD = 72;
const INK = '#12161b', DIM = '#7b858c', RULE = '#d9d3c8', ACC = '#c65f28', TEAL = '#0f7a6f';
const D = 'Chakra Petch', M = 'IBM Plex Mono';
const KR = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

const SCENES = [
  {tag:'OPENING',   dur:4.2},
  {tag:'FAMILY',    dur:6.2},
  {tag:'PROCESS',   dur:7.2},
  {tag:'SPECS',     dur:6.2},
  {tag:'TIMELINE',  dur:5.6},
  {tag:'CLOSING',   dur:5.2},
];
const DUR = SCENES.reduce((a,s)=>a+s.dur,0);

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eOut=t=>1-Math.pow(1-clamp(t),3);
const eIO=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};

let t = 0, playing = true, recording = false, recorder = null, chunks = [];

/* ── 텍스트 렌더 ─────────────────────── */
let SA = 1; // scene alpha multiplier
function text(str,x,y,{font,size,weight=400,color=INK,tracking=0,alpha=1,align='left',fontKR=false}){
  ctx.font = `${weight} ${size}px ${font},${KR}`;
  ctx.textBaseline='alphabetic';
  const ch=[...str];
  let w=0; for(const c of ch) w+=ctx.measureText(c).width;
  w += tracking*(ch.length-1);
  let cx = align==='center'?x-w/2 : align==='right'?x-w : x;
  ctx.fillStyle=color; ctx.globalAlpha = SA*alpha;
  for(const c of ch){ ctx.fillText(c,cx,y); cx += ctx.measureText(c).width + tracking; }
  ctx.globalAlpha=1;
}
function lines(str,x,y,opts,ls){ str.split('\n').forEach((s,i)=>text(s,x,y+i*ls,opts)); }
function rule(x,y,w,color=RULE,th=1,alpha=1){
  ctx.strokeStyle=color;ctx.lineWidth=th;ctx.globalAlpha=SA*alpha;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();ctx.globalAlpha=1;
}
function card(x,y,w,h,alpha){
  ctx.globalAlpha=SA*alpha;
  ctx.fillStyle='#ffffff';ctx.strokeStyle=RULE;ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(x,y,w,h,10);ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
}
function node(x,y,w,h,label,alpha){
  ctx.globalAlpha=SA*alpha;
  ctx.fillStyle='#fff';ctx.strokeStyle=RULE;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();ctx.stroke();
  text(label,x+w/2,y+h/2+4,{font:D,size:12,weight:600,color:INK,tracking:2.5,align:'center'});
  ctx.globalAlpha=1;
}
function pulseDot(x,y,r,color=ACC,tt=0){
  const p=(Math.sin(tt*2.2)+1)/2;
  ctx.globalAlpha=SA*(0.25+0.4*p);
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r*(0.8+0.4*p),0,7);ctx.fill();
  ctx.globalAlpha=1;
}

/* ── 배경 ─────────────────────────────── */
function bg(tt){
  ctx.fillStyle='#faf9f5';ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(236,231,224,.45)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dot grid
  ctx.fillStyle='rgba(18,22,27,.055)';
  const drift=(tt*10)%36;
  for(let x=-36+drift;x<W+36;x+=36)for(let y=-36;y<H+36;y+=36){
    ctx.beginPath();ctx.arc(x,y,1.4,0,7);ctx.fill();
  }
  // soft accent blob
  const bx=W*0.78+Math.sin(tt*0.35)*90, by=H*0.24+Math.cos(tt*0.28)*50;
  const rg=ctx.createRadialGradient(bx,by,0,bx,by,260);
  rg.addColorStop(0,'rgba(198,95,40,.10)');rg.addColorStop(1,'rgba(198,95,40,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
}

/* ── HUD ─────────────────────────────── */
function hud(tt){
  const acc=0; let i=0,loc=tt;
  for(const s of SCENES){ if(tt<s.dur+ (SCENES.slice(0,i).reduce((a,b)=>a+b.dur,0))) {loc=tt-SCENES.slice(0,i).reduce((a,b)=>a+b.dur,0);break;} i++; }
  // scene index
  let c=0;for(const s of SCENES){if(tt<c+s.dur)break;c+=s.dur;}
  text(`${String(c+1).padStart(2,'0')} — ${SCENES[c].tag}`,PAD,30,{font:M,size:11,color:DIM,tracking:2});
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  text(`${fmt(tt)} / ${fmt(DUR)}`,W-PAD,30,{font:M,size:11,color:DIM,tracking:2,align:'right'});
  ctx.strokeStyle=RULE;ctx.lineWidth=2;ctx.globalAlpha=.8;
  ctx.beginPath();ctx.moveTo(0,H-10);ctx.lineTo(W,H-10);ctx.stroke();
  ctx.strokeStyle=ACC;ctx.beginPath();ctx.moveTo(0,H-10);ctx.lineTo(W*(tt/DUR),H-10);ctx.stroke();
  ctx.globalAlpha=1;
}

/* ── Scene 01 오프닝 ─────────────────── */
function scene1(l){
  SA=Math.min(clamp(l/0.5),clamp((4.2-l)/0.5));
  text('ALIBABA · OPEN WEIGHT LLM',PAD,230,{font:M,size:12,tracking:4,
    alpha:clamp(l/0.8)});
  const letters=['Q','W','E','N'];
  let x=PAD;
  ctx.font=`700 128px ${D},${KR}`;
  letters.forEach((c,i)=>{
    const w=ctx.measureText(c).width+8;
    const p=eOut(clamp((l-0.5-i*0.18)/0.6));
    ctx.save();
    ctx.beginPath();ctx.rect(x,260,w,150*p);ctx.clip();
    ctx.globalAlpha=SA*p;ctx.fillStyle=INK;ctx.textBaseline='alphabetic';
    ctx.fillText(c,x,400);ctx.restore();ctx.globalAlpha=1;
    x+=w;
  });
  const rw=380*eOut(clamp((l-1.9)/0.8));
  ctx.strokeStyle=ACC;ctx.lineWidth=2;ctx.globalAlpha=SA;
  ctx.beginPath();ctx.moveTo(PAD,432);ctx.lineTo(PAD+rw,432);ctx.stroke();ctx.globalAlpha=1;
  lines('질문을 토큰으로 쪼개고, 문맥을 계산하고,\n다음 토큰을 한 개씩 예측해 답을 이어 씁니다.',
    PAD,470,{font:`${KR}`?D:D,size:15,weight:400,color:DIM,fontKR:true,
    alpha:eOut(clamp((l-2.5)/0.9))},24);
  pulseDot(W-PAD-60,232,7,ACC,l+2);
}

/* ── Scene 02 패밀리 ─────────────────── */
const FAMILY=[
  ['Qwen3','BASE · REASONING','사고 모드를 켜고 끌 수 있는\n하이브리드 · MoE 포함'],
  ['Qwen2.5','GENERAL','0.5B–72B 다양한 사이즈\n다국어 지원'],
  ['Qwen-VL','VISION','이미지·문서 해석\n표·수식·OCR'],
  ['Qwen-Coder','CODE','코드 생성·수정·리뷰\n에이전트 코딩'],
  ['Qwen-Audio','AUDIO','음성 입력과\n음성 대화 계열'],
];
function scene2(l){
  SA=Math.min(clamp(l/0.5),clamp((6.2-l)/0.5));
  text('01 — FAMILY',PAD,210,{font:M,size:12,tracking:4,alpha:clamp(l/0.5)});
  text('패밀리 라인업',PAD,240,{font:D,size:26,weight:700,
    alpha:eOut(clamp(l/0.7))});
  const offs=[0,26,12,40,20];
  FAMILY.forEach(([name,tag,desc],i)=>{
    const p=eOut(clamp((l-0.35-i*0.14)/0.55));
    const x=PAD+i*204-50*(1-p), y=292+offs[i];
    card(x,y,176,150,p);
    text(tag,x+16,y+34,{font:M,size:10,tracking:2.5,color:ACC,alpha:p});
    text(name,x+16,y+66,{font:D,size:22,weight:700,fontKR:false,alpha:p});
    lines(desc,x+16,y+92,{font:KR,size:12,color:DIM,alpha:p},16);
  });
}

/* ── Scene 03 작동 방식 ───────────────── */
function scene3(l){
  SA=Math.min(clamp(l/0.5),clamp((7.2-l)/0.5));
  text('02 — PROCESS',PAD,190,{font:M,size:12,tracking:4,alpha:clamp(l/0.5)});
  text('토큰이 레이어를 통과해 답이 된다',PAD,222,{font:D,size:24,weight:700,fontKR:true,
    alpha:eOut(clamp(l/0.7))});
  const nodes=['INPUT','TOKENIZE','ATTENTION','FFN ×N','DECODE','ANSWER'];
  const nw=118,gap=34,y=330,h=52;
  const totalW=nodes.length*nw+(nodes.length-1)*gap;
  const lineP=eOut(clamp(l/1.2));
  ctx.strokeStyle=TEAL;ctx.lineWidth=1.2;ctx.setLineDash([5,8]);ctx.lineDashOffset=-l*14;
  ctx.globalAlpha=SA*0.7;
  ctx.beginPath();ctx.moveTo(PAD,y+h/2);ctx.lineTo(PAD+totalW*lineP,y+h/2);ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=1;
  nodes.forEach((n,i)=>{
    const p=eOut(clamp((l-0.5-i*0.12)/0.5));
    const x=PAD+i*(nw+gap);
    ctx.save();ctx.translate(x+nw/2,y+h/2);ctx.scale(p,p);ctx.translate(-x-nw/2,-y-h/2);
    node(x,y,nw,h,n,p);ctx.restore();
  });
  // traveling dots
  for(let k=0;k<3;k++){
    const d=(l*0.22+k/3)%1;
    if(d<=lineP){ctx.globalAlpha=SA;ctx.fillStyle=[ACC,TEAL,'#b34b2f'][k];
      ctx.beginPath();ctx.arc(PAD+totalW*d,y+h/2,4,0,7);ctx.fill();ctx.globalAlpha=1;}
  }
  lines('질문을 잘게 쪼개 토큰으로 만들고 → 어텐션이 앞 문맥을 계산하고 →\n레이어마다 표상을 깊게 갱신하고 → 다음 토큰을 예측해 한 글자씩 이어 씁니다.',
    PAD,470,{font:KR,size:13,color:DIM,alpha:eOut(clamp((l-1.8)/1.2))},22);
  text('transformer blocks · next-token prediction',W-PAD,560,{font:M,size:11,tracking:2,
    color:DIM,align:'right',alpha:eOut(clamp((l-2.2)/1))});
}

/* ── Scene 04 스펙 ───────────────────── */
function scene4(l){
  SA=Math.min(clamp(l/0.5),clamp((6.2-l)/0.5));
  text('03 — SPECS',PAD,190,{font:M,size:12,tracking:4,alpha:clamp(l/0.5)});
  rule(PAD,230,1136*eOut(clamp(l/1)),RULE,1,clamp(l/0.6));
  const specs=[
    ['235','B','최대 변형 · MoE','파라미터 중 일부만 활성화'],
    ['119','+','언어','다국어 이해와 생성'],
    ['128','K','컨텍스트','약 128K 토큰 창'],
  ];
  specs.forEach(([v,unit,name,desc],i)=>{
    const p=eOut(clamp((l-0.3-i*0.25)/1.1));
    const num=Math.round(+v*p);
    const x=PAD+i*380+10;
    text(String(num),x,330,{font:D,size:84,weight:700,alpha:p});
    text(unit,x+ctx.measureText(String(num)).width*0+ctx.measureText(String(num)).width+10,330,
      {font:D,size:26,weight:400,color:ACC,alpha:p});
    text(name,x,370,{font:KR,size:14,weight:700,color:INK,fontKR:true,alpha:p});
    text(desc,x,394,{font:KR,size:12,color:DIM,fontKR:true,alpha:p});
  });
  text('대다수 모델은 오픈 웨이트 · Apache-2.0 계열 라이선스 · 로컬 GPU / vLLM / llama.cpp 배포',
    PAD,560,{font:KR,size:13,color:DIM,fontKR:true,alpha:eOut(clamp((l-1.6)/1.2))});
}

/* ── Scene 05 타임라인 ───────────────── */
const TL=[
  ['2023','Qwen 첫 공개 · 이후 오픈 웨이트 확장'],
  ['2024','Qwen1.5 → Qwen2 · 다국어·장문 강화'],
  ['2024.09','Qwen2.5 · 코딩·수리·다양한 사이즈'],
  ['2025.04','Qwen3 · 사고 모드 전환 · MoE 포함'],
  ['2025+','비전·코딩 계열 확장 · Qwen3-VL / Coder'],
];
function scene5(l){
  SA=Math.min(clamp(l/0.5),clamp((5.6-l)/0.5));
  text('04 — TIMELINE',PAD,190,{font:M,size:12,tracking:4,alpha:clamp(l/0.5)});
  text('계열의 변화',PAD,222,{font:D,size:24,weight:700,fontKR:true,alpha:eOut(clamp(l/0.7))});
  const railX=PAD+8, y0=268, railP=eOut(clamp((l-0.2)/1.2));
  ctx.strokeStyle=ACC;ctx.lineWidth=2;ctx.globalAlpha=SA*0.85;
  ctx.beginPath();ctx.moveTo(railX,y0);ctx.lineTo(railX,y0+300*railP);ctx.stroke();ctx.globalAlpha=1;
  TL.forEach(([yr,txt],i)=>{
    const p=eOut(clamp((l-0.5-i*0.45)/0.6));
    const y=y0+i*66;
    pulseDot(railX,y,4,i%2?TEAL:ACC,l+i);
    text(yr,railX+26,y+4,{font:D,size:16,weight:700,color:ACC,alpha:p});
    text(txt,railX+120,y+4,{font:KR,size:14,color:DIM,fontKR:true,alpha:p});
  });
}

/* ── Scene 06 클로징 ─────────────────── */
function scene6(l){
  SA=Math.min(clamp(l/0.6),clamp((5.2-l)/0.6));
  const p=eOut(clamp(l/0.9));
  ctx.save();ctx.translate(PAD+80,320);ctx.scale(p,p);ctx.translate(-PAD-80,-320);
  text('QWEN',PAD,330,{font:D,size:72,weight:700,tracking:6});
  ctx.restore();
  pulseDot(PAD+52,300,6,ACC,l+1);
  const meta=['ALIBABA GROUP','OPEN WEIGHTS','Apache-2.0 (대다수)','TEXT · IMAGE · AUDIO · VIDEO'];
  meta.forEach((m,i)=>{
    const pp=eOut(clamp((l-0.8-i*0.2)/0.7));
    text(m,PAD+300,300+i*30,{font:i<2?M:KR,size:13,tracking:2,fontKR:true,
      color:i===0?INK:DIM,alpha:pp});
  });
  text('model cards에서 버전·라이선스·성능 확인',PAD,470,{font:KR,size:13,color:DIM,
    fontKR:true,alpha:eOut(clamp((l-1.5)/1))});
  rule(PAD,500,300*eOut(clamp((l-1.8)/0.8)),ACC,2);
}

const render=[scene1,scene2,scene3,scene4,scene5,scene6];

/* ── 메인 루프 ───────────────────────── */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(playing){ t+=dt; if(t>=DUR){ t=DUR; playing=false; syncUI();
    if(recording) recorder && recorder.stop(); } }
  ctx.clearRect(0,0,W,H);
  bg(now/1000);
  let c=0;for(const s of SCENES){ if(t<c+s.dur){render[c](t-c);break;} c+=s.dur; }
  if(t>=DUR) render[5](SCENES[5].dur);
  hud(t);
  document.querySelectorAll('.scenes button').forEach((b,i)=>b.classList.toggle('active',i===c));
  document.getElementById('scrub').value=t;
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  document.getElementById('tc').textContent=`${fmt(t)} / ${fmt(DUR)}`;
  requestAnimationFrame(frame);
}

/* ── UI ──────────────────────────────── */
function syncUI(){
  document.getElementById('playLabel').textContent = playing?'PAUSE':'PLAY';
}
document.getElementById('playBtn').onclick=()=>{ if(t>=DUR)t=0; playing=!playing; syncUI(); };
document.getElementById('restartBtn').onclick=()=>{ t=0; playing=true; syncUI(); };
cv.onclick=()=>{ if(t>=DUR)t=0; playing=!playing; syncUI(); };
document.getElementById('scrub').oninput=e=>{ t=+e.target.value; playing=false; syncUI(); };
document.querySelectorAll('.scenes button').forEach(b=>{
  b.onclick=()=>{ let acc=0;for(let i=0;i<+b.dataset.s;i++)acc+=SCENES[i].dur;
    t=acc;playing=true;syncUI(); };
});

/* ── 내보내기 ─────────────────────────── */
document.getElementById('recBtn').onclick=()=>{
  if(!('MediaRecorder' in window)){alert('이 브라우저는 녹화를 지원하지 않습니다 (Chrome·Edge 사용)');return;}
  if(recording){recorder.stop();return;}
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(m=>MediaRecorder.isTypeSupported(m));
  recorder=new MediaRecorder(cv.captureStream(24),{mimeType:mime,videoBitrate:8000000});
  chunks=[];recorder.ondataavailable=e=>e.data&&chunks.push(e.data);
  recorder.onstop=()=>{
    recording=false;document.getElementById('recBtn').classList.remove('recording');
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='qwen-motion.webm';a.click();
  };
  recording=true;document.getElementById('recBtn').classList.add('recording');
  t=0;playing=true;syncUI();recorder.start();
};

document.fonts.ready.then(()=>requestAnimationFrame(frame));
</script>
