<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QWEN</title>

<!-- Pretendard -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=pretendard@400,500,600,700&display=swap" rel="stylesheet">

<style>
  html,body{margin:0;height:100%;background:#ffffff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#ffffff}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const FONT="'Pretendard','Pretendard Variable',sans-serif";
const INK='#12161b', DIM='#6b747c', ACC='#c65f28', CARD='#f6f4ef';
const BW=1280, BH=720, PAD=72;
const SCENES=[['OPENING',4.2],['FAMILY',6.2],['PROCESS',7.2],['SPECS',6.2],['TIMELINE',5.6],['CLOSING',5.2]];
const DUR=SCENES.reduce((a,s)=>a+s[1],0);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eOut=t=>1-Math.pow(1-clamp(t),3);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

let W,H,dpr,s,ox,oy;
function resize(){
  W=innerWidth; H=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  s=Math.min(W/BW,H/BH); ox=(W-BW*s)/2; oy=(H-BH*s)/2;
}
addEventListener('resize',resize); resize();

let t=0, playing=true, loop=true, last=performance.now();

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function text(str,x,y,{size=14,weight=400,color=INK,tracking=0,alpha=1,align='left'}){
  ctx.font=`${weight} ${size}px ${FONT}`;
  ctx.textBaseline='alphabetic';
  const ch=[...str];
  let w=0; for(const c of ch) w+=ctx.measureText(c).width;
  w+=tracking*(ch.length-1);
  let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.fillStyle=color; ctx.globalAlpha=alpha;
  for(const c of ch){ ctx.fillText(c,cx,y); cx+=ctx.measureText(c).width+tracking; }
  ctx.globalAlpha=1;
}
function lines(str,x,y,o,ls){ str.split('\n').forEach((l,i)=>text(l,x,y+i*ls,o)); }
function dot(x,y,r=6,color=ACC,a=1){ ctx.globalAlpha=a; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.globalAlpha=1; }

function bg(){ ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H); }

function scene1(l){
  const a=Math.min(clamp(l/0.5),clamp((4.2-l)/0.5));
  text('ALIBABA · OPEN WEIGHT LLM',PAD,230,{size:13,weight:500,color:DIM,tracking:3,alpha:a});
  let x=PAD; ctx.font=`700 128px ${FONT}`; ctx.textBaseline='alphabetic';
  ['Q','W','E','N'].forEach((c,i)=>{
    const w=ctx.measureText(c).width+8, p=eOut(clamp((l-0.5-i*0.18)/0.6));
    ctx.save(); ctx.beginPath(); ctx.rect(x,262,w,150*p); ctx.clip();
    ctx.globalAlpha=a*p; ctx.fillStyle=INK; ctx.fillText(c,x,400); ctx.restore(); ctx.globalAlpha=1;
    x+=w;
  });
  dot(PAD+8,428,6,ACC,a);
  lines('질문을 토큰으로 쪼개고, 문맥을 계산하고,\n다음 토큰을 한 개씩 예측해 답을 이어 씁니다.',PAD,470,
    {size:15,color:DIM,alpha:a},24);
  dot(W-PAD-34,230,7,ACC,a);
}

const FAMILY=[
  ['Qwen3','BASE · REASONING','사고 모드를 켜고 끌 수 있는\n하이브리드 · MoE 포함'],
  ['Qwen2.5','GENERAL','0.5B–72B 다양한 사이즈\n다국어 지원'],
  ['Qwen-VL','VISION','이미지·문서 해석\n표·수식·OCR'],
  ['Qwen-Coder','CODE','코드 생성·수정·리뷰\n에이전트 코딩'],
  ['Qwen-Audio','AUDIO','음성 입력과\n음성 대화 계열']
];
function scene2(l){
  const a=Math.min(clamp(l/0.5),clamp((6.2-l)/0.5));
  text('01 / FAMILY',PAD,206,{size:13,weight:500,color:DIM,tracking:3,alpha:a});
  text('패밀리 라인업',PAD,238,{size:26,weight:700,alpha:a});
  const offs=[0,26,12,40,20];
  FAMILY.forEach(([name,tag,desc],i)=>{
    const p=eOut(clamp((l-0.35-i*0.14)/0.55));
    const x=PAD+i*204-50*(1-p), y=290+offs[i];
    ctx.globalAlpha=p*a; ctx.fillStyle=CARD; rr(x,y,176,150,10); ctx.fill(); ctx.globalAlpha=1;
    text(tag,x+18,y+34,{size:11,weight:600,color:ACC,tracking:2,alpha:p*a});
    text(name,x+18,y+62,{size:22,weight:700,alpha:p*a});
    lines(desc,x+18,y+88,{size:12,color:DIM,alpha:p*a},16);
  });
}

function scene3(l){
  const a=Math.min(clamp(l/0.5),clamp((7.2-l)/0.5));
  text('02 / PROCESS',PAD,188,{size:13,weight:500,color:DIM,tracking:3,alpha:a});
  text('토큰이 레이어를 통과해 답이 된다',PAD,220,{size:24,weight:700,alpha:a});

  const nodes=['INPUT','TOKENIZE','ATTENTION','FFN ×N','DECODE','ANSWER'];
  const nw=118, gap=34, y=328, h=52, totalW=nodes.length*nw+(nodes.length-1)*gap;
  nodes.forEach((n,i)=>{
    const p=eOut(clamp((l-0.5-i*0.12)/0.5));
    const x=PAD+i*(nw+gap);
    ctx.save(); ctx.translate(x+nw/2,y+h/2); ctx.scale(p,p); ctx.translate(-x-nw/2,-y-h/2);
    ctx.globalAlpha=p*a; ctx.fillStyle=CARD; rr(x,y,nw,h,8); ctx.fill(); ctx.globalAlpha=1;
    text(n,x+nw/2,y+h/2+4,{size:12,weight:600,tracking:2,align:'center',alpha:p*a});
    ctx.restore();
  });

  const colors=[ACC,'#0f7a6f','#d0765a'];
  for(let k=0;k<3;k++){
    const d=(l*0.22+k/3)%1;
    dot(PAD+totalW*d,y+h/2,5,colors[k],a);
  }

  lines('질문을 잘게 쪼개 토큰으로 만들고, 어텐션이 앞 문맥을 계산하고,\n레이어마다 표상을 깊게 갱신하고, 다음 토큰을 예측해 한 글자씩 이어 씁니다.',PAD,468,
    {size:13,color:DIM,alpha:eOut(clamp((l-1.8)/1.2))},22);
  text('transformer blocks · next-token prediction',W-PAD,556,{size:11,color:DIM,tracking:2,align:'right',alpha:a});
}

function scene4(l){
  const a=Math.min(clamp(l/0.5),clamp((6.2-l)/0.5));
  text('03 / SPECS',PAD,188,{size:13,weight:500,color:DIM,tracking:3,alpha:a});
  const specs=[['235','B','최대 변형 · MoE','파라미터 중 일부만 활성화'],
    ['119','+','언어','다국어 이해와 생성'],['128','K','컨텍스트','약 128K 토큰 창']];
  specs.forEach(([v,u,name,desc],i)=>{
    const p=eOut(clamp((l-0.3-i*0.25)/1.1));
    const num=Math.round(+v*p), x=PAD+i*380+10;
    ctx.globalAlpha=p*a; ctx.fillStyle=CARD; rr(x-18,y=300,360,118,14); ctx.fill(); ctx.globalAlpha=1;
    text(String(num),x,326,{size:84,weight:700,alpha:p*a});
    ctx.font=`700 84px ${FONT}`; const wNum=ctx.measureText(String(num)).width;
    text(u,x+wNum+10,326,{size:26,weight:500,color:ACC,alpha:p*a});
    text(name,x,368,{size:14,weight:700,alpha:p*a});
    text(desc,x,392,{size:12,color:DIM,alpha:p*a});
  });
  text('대다수 모델은 오픈 웨이트 · Apache-2.0 계열 · 로컬 GPU / vLLM / llama.cpp 배포',PAD,556,
    {size:13,color:DIM,alpha:eOut(clamp((l-1.6)/1.2))});
}

const TL=[
  ['2023','Qwen 첫 공개 · 이후 오픈 웨이트 확장'],
  ['2024','Qwen1.5 → Qwen2 · 다국어·장문 강화'],
  ['2024.09','Qwen2.5 · 코딩·수리·다양한 사이즈'],
  ['2025.04','Qwen3 · 사고 모드 전환 · MoE 포함'],
  ['2025+','비전·코딩 계열 확장 · Qwen3-VL / Coder']
];
function scene5(l){
  const a=Math.min(clamp(l/0.5),clamp((5.6-l)/0.5));
  text('04 / TIMELINE',PAD,188,{size:13,weight:500,color:DIM,tracking:3,alpha:a});
  text('계열의 변화',PAD,220,{size:24,weight:700,alpha:a});
  TL.forEach(([yr,txt],i)=>{
    const p=eOut(clamp((l-0.5-i*0.45)/0.6));
    const y=266+i*66;
    ctx.globalAlpha=p*a; ctx.fillStyle=CARD; rr(PAD+42,y-16,1100,44,10); ctx.fill(); ctx.globalAlpha=1;
    dot(PAD+8,y+4,5,i%2?'#0f7a6f':ACC,p*a);
    text(yr,PAD+26,y+4,{size:16,weight:700,color:ACC,alpha:p*a});
    text(txt,PAD+120,y+4,{size:14,color:DIM,alpha:p*a});
  });
}

function scene6(l){
  const a=Math.min(clamp(l/0.6),clamp((5.2-l)/0.6));
  const p=eOut(clamp(l/0.9));
  ctx.save(); ctx.translate(PAD+80,326); ctx.scale(p,p); ctx.translate(-PAD-80,-326);
  text('QWEN',PAD,326,{size:72,weight:700,tracking:6,alpha:a}); ctx.restore();
  dot(PAD+32,302,7,ACC,a);
  ['ALIBABA GROUP','OPEN WEIGHTS','Apache-2.0','TEXT · IMAGE · AUDIO · VIDEO']
    .forEach((m,i)=>text(m,PAD+300,296+i*30,{size:13,weight:i<2?600:400,color:i===0?INK:DIM,
      alpha:eOut(clamp((l-0.8-i*0.2)/0.7))*a}));
  text('model cards에서 버전·라이선스·성능 확인',PAD,466,{size:13,color:DIM,alpha:eOut(clamp((l-1.5)/1))*a});
}

const RENDER=[scene1,scene2,scene3,scene4,scene5,scene6];

function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(playing){ t+=dt; if(t>=DUR){ if(loop){t=0;} else {t=DUR; playing=false;} } }
  bg(); ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);
  let idx=0, local=t, acc=0;
  for(const sc of SCENES){ if(t<acc+sc[1]){ local=t-acc; break; } acc+=sc[1]; idx++; }
  RENDER[idx](local);
  requestAnimationFrame(frame);
}
document.fonts.ready.then(()=>requestAnimationFrame(frame));

addEventListener('pointerdown',()=>{ playing=!playing; });
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); playing=!playing; }
  else if(k==='r'){ t=0; playing=true; }
  else if(k==='f'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
  else if(k==='arrowleft'){ e.preventDefault(); t=Math.max(0,t-1); }
  else if(k==='arrowright'){ e.preventDefault(); t=Math.min(DUR,t+1); }
  else if(k>='1'&&k<='6'){ let acc=0; for(let i=0;i<+k-1;i++) acc+=SCENES[i][1]; t=acc; playing=true; }
});
</script>
</body>
</html>
